x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    logging: *bounded-logs

    build:
      context: ..
      dockerfile: Dockerfile

    image: llmgate:local

    # Empty optional values use defaults from cmd/gateway/config.go.
    environment:
      # Public HTTP and shutdown.
      GATEWAY_ADDR: "0.0.0.0:8080"
      GATEWAY_READ_TIMEOUT: ${GATEWAY_READ_TIMEOUT:-}
      GATEWAY_READ_HEADER_TIMEOUT: ${GATEWAY_READ_HEADER_TIMEOUT:-}
      GATEWAY_IDLE_TIMEOUT: ${GATEWAY_IDLE_TIMEOUT:-}
      GATEWAY_SHUTDOWN_TIMEOUT: ${GATEWAY_SHUTDOWN_TIMEOUT:-}

      # Chat request limits.
      GATEWAY_MAX_TOKENS: ${GATEWAY_MAX_TOKENS:-}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-}

      # Inference backend.
      GATEWAY_UPSTREAM_URL: "http://backend:8080"
      GATEWAY_UPSTREAM_TIMEOUT: ${GATEWAY_UPSTREAM_TIMEOUT:-}
      GATEWAY_UPSTREAM_CONNECT_TIMEOUT: ${GATEWAY_UPSTREAM_CONNECT_TIMEOUT:-}
      GATEWAY_UPSTREAM_HEADER_TIMEOUT: ${GATEWAY_UPSTREAM_HEADER_TIMEOUT:-}
      GATEWAY_STREAM_IDLE_TIMEOUT: ${GATEWAY_STREAM_IDLE_TIMEOUT:-}
      GATEWAY_READINESS_TIMEOUT: ${GATEWAY_READINESS_TIMEOUT:-}

      # Postgres.
      GATEWAY_DATABASE_URL: "postgres://llmgate@postgres:5432/llmgate?sslmode=disable"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GATEWAY_DATABASE_MAX_CONNS: ${GATEWAY_DATABASE_MAX_CONNS:-}
      GATEWAY_DATABASE_CONNECT_TIMEOUT: ${GATEWAY_DATABASE_CONNECT_TIMEOUT:-}

      # Authentication cache.
      GATEWAY_AUTH_LOOKUP_TIMEOUT: ${GATEWAY_AUTH_LOOKUP_TIMEOUT:-}
      GATEWAY_AUTH_CACHE_TTL: ${GATEWAY_AUTH_CACHE_TTL:-}
      GATEWAY_AUTH_CACHE_CAPACITY: ${GATEWAY_AUTH_CACHE_CAPACITY:-}

      # Redis and request rate limits.
      GATEWAY_REDIS_URL: "redis://redis:6379/0"
      GATEWAY_REDIS_MAX_CONNS: ${GATEWAY_REDIS_MAX_CONNS:-}
      GATEWAY_REDIS_CONNECT_TIMEOUT: ${GATEWAY_REDIS_CONNECT_TIMEOUT:-}
      GATEWAY_RATE_LIMIT_TIMEOUT: ${GATEWAY_RATE_LIMIT_TIMEOUT:-}

      # Daily token quotas.
      GATEWAY_QUOTA_GRACE_PERCENT: ${GATEWAY_QUOTA_GRACE_PERCENT:-}
      GATEWAY_QUOTA_COUNT_TIMEOUT: ${GATEWAY_QUOTA_COUNT_TIMEOUT:-}
      GATEWAY_QUOTA_COUNT_MAX_BYTES: ${GATEWAY_QUOTA_COUNT_MAX_BYTES:-}
      GATEWAY_QUOTA_REDIS_TIMEOUT: ${GATEWAY_QUOTA_REDIS_TIMEOUT:-}

      # Usage recording.
      GATEWAY_USAGE_WRITE_TIMEOUT: ${GATEWAY_USAGE_WRITE_TIMEOUT:-}
      GATEWAY_USAGE_MAX_BYTES: ${GATEWAY_USAGE_MAX_BYTES:-}

      # Prometheus metrics.
      GATEWAY_METRICS_KEY_CAPACITY: ${GATEWAY_METRICS_KEY_CAPACITY:-}
      GATEWAY_METRICS_MAX_SCRAPES: ${GATEWAY_METRICS_MAX_SCRAPES:-}
      GATEWAY_METRICS_SCRAPE_TIMEOUT: ${GATEWAY_METRICS_SCRAPE_TIMEOUT:-}

      # Private admin API.
      GATEWAY_ADMIN_ENABLED: ${GATEWAY_ADMIN_ENABLED:-}
      GATEWAY_ADMIN_ADDR: "127.0.0.1:8082"
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_ADMIN_MAX_BODY_BYTES: ${GATEWAY_ADMIN_MAX_BODY_BYTES:-}
      GATEWAY_ADMIN_CREATE_TIMEOUT: ${GATEWAY_ADMIN_CREATE_TIMEOUT:-}
      GATEWAY_ADMIN_REVOKE_TIMEOUT: ${GATEWAY_ADMIN_REVOKE_TIMEOUT:-}

    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/v1/readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

    stop_grace_period: ${GATEWAY_STOP_GRACE_PERIOD:-20s}
    restart: unless-stopped

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  backend:
    logging: *bounded-logs
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11681@sha256:53bec65a6120e8ab8cb76af725c3b05a7f098b5308c96e5d9f8dad98f1f1f639

    command:
      - --model
      - /models/model.gguf
      - --alias
      - glm-edge-4b-chat
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CONTEXT_SIZE:-2048}
      - --parallel
      - ${LLAMA_PARALLEL:-1}
      - --threads
      - ${LLAMA_THREADS:-6}
      - --device
      - CUDA0
      - --n-gpu-layers
      - all

    gpus: all

    volumes:
      - type: bind
        source: ${LLMGATE_MODEL_PATH:-${HOME}/.cache/llmgate/models/glm-edge-4b-chat/ggml-model-Q6_K.gguf}
        target: /models/model.gguf
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--max-time",
          "2",
          "http://127.0.0.1:8080/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

    stop_grace_period: 30s
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  redis:
    logging: *bounded-logs
    image: redis:8.10.2-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

    restart: unless-stopped

  postgres:
    logging: *bounded-logs
    image: postgres:18.6

    environment:
      POSTGRES_USER: llmgate
      POSTGRES_DB: llmgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmgate -d llmgate"]
      interval: 2s
      timeout: 2s
      retries: 30

    restart: unless-stopped

  migrate:
    logging: *bounded-logs
    image: migrate/migrate:v4.20.1

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ../migrations:/migrations:ro

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    command:
      - "-path=/migrations"
      - "-database=postgres://llmgate@postgres:5432/llmgate?sslmode=disable"
      - "up"

    restart: "no"

volumes:
  redis-data:
  postgres-data:
